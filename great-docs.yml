# Great Docs configuration: every option and its default is listed at
# https://posit-dev.github.io/great-docs/user-guide/configuration.html
# Build the site with `uv run --group docs great-docs build` (needs Quarto).

display_name: dasviz
parser: numpy
dynamic: false # static: no backend is imported to document it
repo: https://github.com/DASDAE/dasviz
site_url: https://dasdae.github.io/dasviz/
pypi: true

authors:
  - name: Derrick Chambers
    role: Author

announcement:
  content: "**Experimental.** dasviz's API will change without notice."
  type: warning
  dismissable: true

# Pages are ordered by their number and grouped by `guide-section` in
# their front matter, following Diataxis: tutorial, how-to, explanation.
user_guide: docs/guide

reference:
  - title: Figures (fig)
    desc: Static figures, as `patch.fig.<method>`.
    contents:
      - mpl.waterfall
  - title: Scenes (scene)
    desc: 3D scenes, as `patch.scene.<method>`.
    contents:
      - pv.patchviewer
      - pv.PatchViewer
  - title: Preparation
    desc: Backend-free helpers every renderer shares.
    contents:
      - prep.color_limits
      - prep.colorbar_extend
      - prep.decimate_for_display
      - prep.default_colormap
      - prep.cell_edges
      - prep.CellEdges
      - prep.dim_label
      - prep.data_label
      - prep.get_valid_runs
      - prep.is_colocated
      - prep.encode_categories
      - prep.category_color_list
      - prep.make_color_source
      - prep.find_static_coords
      - prep.time_to_seconds
      - prep.coerce_step
      - prep.nice_step
      - prep.nearest_index
      - prep.advance_playhead
      - prep.format_time
      - prep.format_duration
  - title: Extending dasviz
    desc: Declaring and importing optional backends.
    contents:
      - requires
      - import_backend
      - Backend
