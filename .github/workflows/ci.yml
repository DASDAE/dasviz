# Lint, test, and build the package on pushes to main and on pull requests.
name: CI
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Supersede the previous run: by pull request, or by branch for pushes.
concurrency:
  group: CI-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"

      - name: install
        run: uv sync --locked

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  # Every namespace loads whatever extras are installed, so test without
  # any as well as with all of them.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
        extras: ["none", "all"]
    env:
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      # VTK renders off screen through OSMesa/EGL, which need these.
      - name: install system libraries
        if: matrix.extras == 'all'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libxrender1

      - name: install
        run: uv sync --locked ${{ matrix.extras == 'all' && '--all-extras' || '' }}

      - name: run tests
        run: uv run pytest

  # dasviz follows DASCore closely; catch a change on its dev branch early.
  dascore-dev:
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"

      - name: install
        run: uv sync --locked --all-extras

      - name: run tests
        run: >-
          uv run --with "dascore @ git+https://github.com/DASDAE/dascore@dev"
          pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: "3.14"

      - name: build
        run: uv build

      - name: check distributions
        run: uvx twine check --strict dist/*
